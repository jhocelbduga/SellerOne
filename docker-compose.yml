services:
  sellerone:
    build: .
    ports:
      - "3100:3100"
    environment:
      PORT: 3100
      DATABASE_PATH: /data/sellerone.sqlite
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - sellerone-data:/data
    restart: unless-stopped

volumes:
  sellerone-data:
